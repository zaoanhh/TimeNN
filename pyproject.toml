[project]
name = "timenn"
version = "0.1.0"
description = "Time-NN: temporally stable neural networks for robust Wi-Fi sensing"
readme = "README.md"
authors = [
    { name = "Fei Shang", email = "feishang@hku.hk" },
    { name = "Chenshu Wu", email = "chenshu@cs.hku.hk" },
]
requires-python = ">=3.11"
keywords = ["wifi-sensing", "time-series", "wavelet", "temporal-stability", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "hydra-core==1.3.2",
    "matplotlib==3.10.7",
    "numpy==2.3.5",
    "omegaconf==2.3.0",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "tqdm==4.67.1",
]

[project.urls]
Repository = "https://github.com/zaoanhh/TimeNN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timenn"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
