type: lms_cnn
stage_configs:
- filter_type: morlet
  scale_type: linear
  num_scales: 16
  min_sigma: 0.0
  f_min: 0.005
  f_max: 0.49
  kernel_length: 512
  use_joint_mixing: true
  freq_kernel_size: 3
  time_kernel_size: 69
  reduce_scales: false
  pool_type: learnable
  mixing_groups: null
  intra_out_per_group: 1
  inter_out: 16
  blur_stride: 4
  blur_kernel_size: 51
  blur_min_sigma: 9.0
  use_log: false
  mixing_activation: relu
cnn_layers:
- 16
- 32
- 64
cnn_kernel_size: 5
cnn_stride: 2
cnn_dropout: 0.3
mlp_hidden: 256
dropout: 0.3
use_duration: false
coverage_lambda: 0.1
